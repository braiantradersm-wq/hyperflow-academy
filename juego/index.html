<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1020">
<title>El Mapa · Hyperflow Academy — tu aventura</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%97%BA%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --ink:#0B0D1C;--ink-2:#12142A;--ink-3:#1A1D3A;--ink-4:#262A52;
    --line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.16);
    --text:#EEF0FB;--muted:#9BA0C4;--muted-2:#6E739A;
    --indigo:#6674FF;--indigo-2:#8B7BFF;--amber:#FFB454;--green:#3FD07F;--red:#FF6B7A;
    --serif:"Georgia","Times New Roman",serif;--disp:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;--mono:ui-monospace,"Cascadia Code","Consolas",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:
    radial-gradient(80% 40% at 50% -5%,rgba(102,116,255,.14),transparent 60%),var(--ink);
    color:var(--text);font-family:var(--disp);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
  .wrap{max-width:640px;margin:0 auto;padding:0 18px}
  .g{background:linear-gradient(115deg,var(--indigo-2),var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent}
  .serif{font-family:var(--serif);font-style:italic}
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
  a{color:inherit;text-decoration:none}

  /* HEADER RANGO */
  header{position:sticky;top:0;z-index:20;background:rgba(11,13,28,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .hin{display:flex;align-items:center;gap:12px;padding:11px 0 12px}
  .rank{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
  .rank .badge{width:44px;height:44px;flex:none;border-radius:12px;background:linear-gradient(135deg,var(--amber),#FF9A3D);display:grid;place-items:center;font-size:22px;box-shadow:0 6px 18px -6px var(--amber)}
  .rank .rt{min-width:0}
  .rank .rname{font-weight:700;font-size:14.5px;line-height:1.1}
  .rank .rsub{font-family:var(--mono);font-size:11px;color:var(--muted-2)}
  .xpbar{height:7px;background:var(--ink-4);border-radius:99px;overflow:hidden;margin-top:6px}
  .xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--indigo),var(--amber));transition:width .6s}
  .streak{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:var(--mono)}
  .streak .fl{font-size:22px} .streak b{font-size:13px;color:var(--amber)} .streak span{font-size:9px;color:var(--muted-2);letter-spacing:.08em}

  /* INTRO + BADGES */
  .intro{padding:24px 0 6px;text-align:center}
  .intro .k{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--amber);margin-bottom:10px}
  .intro h1{font-family:var(--serif);font-style:italic;font-size:clamp(26px,7vw,42px);line-height:1.05}
  .intro p{color:var(--muted);font-size:14px;margin-top:10px}
  .badges{display:flex;gap:9px;overflow-x:auto;padding:16px 2px 6px;scrollbar-width:none}
  .badges::-webkit-scrollbar{display:none}
  .bdg{flex:none;width:76px;text-align:center;opacity:.35;transition:.3s;filter:grayscale(1)}
  .bdg.on{opacity:1;filter:none}
  .bdg .bi{width:52px;height:52px;margin:0 auto 6px;border-radius:14px;background:var(--ink-2);border:1px solid var(--line-2);display:grid;place-items:center;font-size:24px}
  .bdg.on .bi{border-color:var(--amber);box-shadow:0 6px 18px -8px var(--amber);background:rgba(255,180,84,.1)}
  .bdg span{font-size:10px;color:var(--muted);line-height:1.2;display:block}

  /* MAPA */
  .season{margin:26px 0 4px;text-align:center;position:relative}
  .season::before,.season::after{content:"";position:absolute;top:50%;width:24%;height:1px;background:var(--line-2)}
  .season::before{left:4%} .season::after{right:4%}
  .season .sn{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
  .season .st{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--muted)}

  .path{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;padding:6px 0}
  .nodewrap{display:flex;flex-direction:column;align-items:center;gap:5px;transition:transform .3s}
  .conn{width:3px;height:22px;background:var(--ink-4);border-radius:2px}
  .conn.lit{background:linear-gradient(var(--green),var(--indigo))}
  .node{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;position:relative;border:3px solid var(--line-2);background:var(--ink-2);transition:.2s;font-weight:700}
  .node .nn{font-family:var(--mono);font-size:16px;color:var(--muted-2)}
  .node.done{background:linear-gradient(135deg,var(--green),#2ea866);border-color:var(--green);box-shadow:0 8px 22px -8px var(--green)}
  .node.done .nn{display:none}
  .node.done::after{content:"";width:22px;height:12px;border-left:4px solid #06210f;border-bottom:4px solid #06210f;transform:rotate(-45deg) translateY(-2px)}
  .node.current{background:linear-gradient(135deg,var(--indigo),var(--indigo-2));border-color:#fff;cursor:pointer;animation:bob 1.8s ease-in-out infinite}
  .node.current .nn{color:#fff}
  .node.current::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--indigo);opacity:.5;animation:ring 1.8s infinite}
  @keyframes ring{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.3);opacity:0}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .node.locked{opacity:.55}
  .node.locked .nn{display:none}
  .node.locked::after{content:"";width:16px;height:13px;border:2.5px solid var(--muted-2);border-radius:3px;box-shadow:0 -6px 0 -2.5px transparent,inset 0 0 0 0 transparent;position:relative}
  .node.locked::before{content:"";position:absolute;width:12px;height:8px;border:2.5px solid var(--muted-2);border-bottom:0;border-radius:6px 6px 0 0;margin-top:-11px}
  .nlabel{font-family:var(--serif);font-style:italic;font-size:13.5px;color:var(--muted);text-align:center;max-width:150px}
  .nodewrap.done .nlabel{color:var(--text)}
  .nodewrap.current .nlabel{color:#fff;font-weight:600}
  .start-flag{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--indigo-2);margin-top:-2px}

  /* CERTIFICADO final */
  .cert-node{margin:16px 0 40px;text-align:center}
  .cert-node .cn{width:92px;height:92px;margin:0 auto 12px;border-radius:22px;display:grid;place-items:center;font-size:44px;
    background:var(--ink-2);border:2px solid var(--line-2);transition:.3s}
  .cert-node.ready .cn{border-color:var(--amber);background:rgba(255,180,84,.12);box-shadow:0 12px 40px -12px var(--amber)}
  .cert-node .ct{font-family:var(--serif);font-style:italic;font-size:18px}
  .cert-node .cs{font-family:var(--mono);font-size:11px;color:var(--muted-2);margin-top:4px}

  /* toast + footer */
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(100px);background:var(--ink-3);border:1px solid var(--line-2);
    border-radius:13px;padding:12px 18px;z-index:50;opacity:0;transition:.35s;max-width:90vw;font-size:13.5px;display:flex;gap:9px;align-items:center;box-shadow:0 20px 50px -20px #000}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .foot{text-align:center;padding:10px 0 40px}
  .foot button{font-family:var(--mono);font-size:11px;color:var(--muted-2);padding:8px 12px;border-radius:8px;border:1px solid var(--line)}
  .foot button:hover{color:var(--text);border-color:var(--line-2)}
  .demohint{position:fixed;bottom:14px;left:14px;font-family:var(--mono);font-size:10.5px;color:var(--muted-2);background:rgba(11,13,28,.85);border:1px solid var(--line);padding:5px 9px;border-radius:8px;z-index:40}
</style>
</head>
<body>
<header><div class="wrap"><div class="hin">
  <div class="rank">
    <div class="badge" id="rankIcon">🎖️</div>
    <div class="rt">
      <div class="rname" id="rankName">Aprendiz</div>
      <div class="rsub" id="rankSub">0 / 360 XP</div>
      <div class="xpbar"><i id="xpFill"></i></div>
    </div>
  </div>
  <div class="streak"><span class="fl">🔥</span><b id="streakN">3</b><span>RACHA</span></div>
</div></div></header>

<main class="wrap">
  <div class="intro">
    <div class="k">Tu aventura · 6 temporadas · 22 misiones</div>
    <h1>El <span class="g">Mapa</span></h1>
    <p>Cada misión que superas ilumina el camino, te da XP y sube tu rango. Aprende jugando hasta el certificado.</p>
  </div>

  <div class="badges" id="badges"></div>

  <div id="map"></div>

  <div class="cert-node" id="certNode">
    <div class="cn" id="certIc">🎓</div>
    <div class="ct">Certificado de Arquitecto</div>
    <div class="cs" id="certSub">Jefe final · completa las 22 misiones</div>
  </div>

  <div class="foot">
    <button onclick="resetGame()">↻ reiniciar mi progreso (demo)</button>
  </div>
</main>

<div class="toast" id="toast"></div>
<div class="demohint" id="demohint"></div>

<script>
/* ============ DATOS ============ */
const CODE={1:"El Origen",2:"La Mente",3:"El Lenguaje Secreto",4:"El Arsenal Creativo",5:"El Constructor",6:"El Conector",7:"El Copiloto",8:"El Cazador de Procesos",9:"El Arquitecto",10:"El Cartógrafo",11:"La Máquina",12:"El Extractor",13:"El Guardián",14:"El Orquestador",15:"El Alquimista",16:"Los Ojos de la Máquina",17:"El Puente",18:"La Voz",19:"El Rostro Sintético",20:"El Director",21:"El Centinela",22:"La Conciencia"};
const SEASONS=[
 {n:1,title:"El Despertar",eps:[1,2,3,4]},
 {n:2,title:"El Arsenal",eps:[5,6,7]},
 {n:3,title:"El Método",eps:[8,9,10]},
 {n:4,title:"La Fuerza",eps:[11,12,13,14]},
 {n:5,title:"La Expansión",eps:[15,16,17]},
 {n:6,title:"El Dominio",eps:[18,19,20,21,22]}
];
const XP_EP=120;
const RANKS=[{min:0,name:"Aprendiz",ic:"🎖️"},{min:360,name:"Operador",ic:"🥉"},{min:840,name:"Analista",ic:"🥈"},{min:1440,name:"Arquitecto Jr.",ic:"🥇"},{min:2040,name:"Arquitecto",ic:"💎"},{min:2640,name:"Maestro",ic:"👑"}];
const BADGES=[
 {ic:"🏅",name:"Primer paso",has:d=>d.length>=1},
 {ic:"🎯",name:"Clasificador",has:d=>d.includes(1)},
 {ic:"📊",name:"Analista ROI",has:d=>d.includes(1)},
 {ic:"🧭",name:"Consultor",has:d=>d.includes(1)},
 {ic:"🏆",name:"Temporada 1",has:d=>[1,2,3,4].every(x=>d.includes(x))},
 {ic:"🔥",name:"Racha viva",has:d=>true},
 {ic:"👑",name:"Certificado",has:d=>d.length>=22}
];

/* ============ ESTADO ============ */
const P=new URLSearchParams(location.search);
const KEY='hf_game_v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{done:[],streak:3}}catch(e){return{done:[],streak:3}}}
function save(g){try{localStorage.setItem(KEY,JSON.stringify(g))}catch(e){}}
let G=load();
// sincronizar con la lección EP01 (si la completó, cuenta como hecha)
try{ if(localStorage.getItem('hyperflow_ep01_done')==='1' && !G.done.includes(1)){G.done.push(1);save(G);} }catch(e){}
if(P.has('reset')){G={done:[],streak:3};save(G);try{localStorage.removeItem('hyperflow_ep01_done')}catch(e){}}
if(P.has('demo')){G={done:[1,2,3,4,5],streak:5};save(G);}   // vista de ejemplo "jugando"

const $=s=>document.querySelector(s);
function xp(){return G.done.length*XP_EP;}
function frontier(){for(let n=1;n<=22;n++){if(!G.done.includes(n))return n;}return 23;}
function rankOf(x){let r=RANKS[0];RANKS.forEach(k=>{if(x>=k.min)r=k;});return r;}
function nextRank(x){return RANKS.find(k=>k.min>x);}

/* ============ RENDER ============ */
function renderHeader(){
  const x=xp(),r=rankOf(x),nx=nextRank(x);
  $('#rankIcon').textContent=r.ic; $('#rankName').textContent=r.name;
  if(nx){ $('#rankSub').textContent=x+' / '+nx.min+' XP'; $('#xpFill').style.width=Math.min(100,((x-r.min)/(nx.min-r.min))*100)+'%'; }
  else { $('#rankSub').textContent=x+' XP · MÁXIMO'; $('#xpFill').style.width='100%'; }
  $('#streakN').textContent=G.streak;
}
function renderBadges(){
  $('#badges').innerHTML=BADGES.map(b=>{const on=b.has(G.done);
    return `<div class="bdg ${on?'on':''}"><div class="bi">${b.ic}</div><span>${b.name}</span></div>`;}).join('');
}
function renderMap(){
  const fr=frontier(); const offs=[0,52,72,52,0,-52,-72,-52]; let gi=0;
  let html='';
  SEASONS.forEach(s=>{
    html+=`<div class="season"><div class="sn">Temporada ${s.n}</div><div class="st">${s.title}</div></div><div class="path">`;
    s.eps.forEach(n=>{
      const done=G.done.includes(n); const cur=(n===fr); const state=done?'done':(cur?'current':'locked');
      const lit=done||cur;
      html+=`${gi>0?`<div class="conn ${done||n<fr?'lit':''}"></div>`:''}
        <div class="nodewrap ${state}" style="transform:translateX(${offs[gi%offs.length]}px)">
          <button class="node ${state}" onclick="tapNode(${n})" aria-label="${CODE[n]}"><span class="nn">${n}</span></button>
          <div class="nlabel">“${CODE[n]}”</div>
          ${cur?'<div class="start-flag">▸ empieza aquí</div>':''}
        </div>`;
      gi++;
    });
    html+='</div>';
  });
  $('#map').innerHTML=html;
  // certificado
  const all=G.done.length>=22;
  $('#certNode').classList.toggle('ready',all);
  $('#certSub').textContent=all?'¡Desbloqueado! Reclama tu certificado':'Jefe final · completa las 22 misiones';
}
function renderAll(){renderHeader();renderBadges();renderMap();}

/* ============ INTERACCIÓN ============ */
function tapNode(n){
  const done=G.done.includes(n), fr=frontier();
  if(n===1){ location.href='../ep01/'; return; }          // EP01 jugable
  if(done){ toast('✓ “'+CODE[n]+'” ya superada. (Podrás repasarla)'); return; }
  if(n===fr){ toast('🚧 “'+CODE[n]+'” está en construcción — el motor es este mismo (como EP01).'); return; }
  toast('🔒 Supera “'+CODE[fr]+'” para desbloquear esta misión.');
}
let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600);}
function resetGame(){ if(confirm('¿Reiniciar tu progreso del mapa?')){G={done:[],streak:3};save(G);try{localStorage.removeItem('hyperflow_ep01_done')}catch(e){}renderAll();toast('Progreso reiniciado. Empieza por “El Origen”.');} }

/* demo hint */
$('#demohint').textContent = P.has('demo')?'modo demo: progreso de ejemplo':(G.done.length?('progreso real: '+G.done.length+'/22'):'juega EP01 y vuelve aquí');

renderAll();
</script>
</body>
</html>
